# GitHub Pages 배포
# API 키를 저장소에 커밋하지 않도록, 배포할 때만 저장소 Secrets 로 js/config.js 를 만들어 넣는다.
# 필요한 Secrets: YOUTUBE_API_KEY, GOOGLE_CLIENT_ID
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 두어야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write js/config.js from repository secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::YOUTUBE_API_KEY secret is not set"
            exit 1
          fi
          printf "const YOUTUBE_API_KEY = '%s';\nconst GOOGLE_CLIENT_ID = '%s';\n" "$YOUTUBE_API_KEY" "$GOOGLE_CLIENT_ID" > js/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
