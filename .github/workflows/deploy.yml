# GitHub Pages 배포
# API 키를 저장소에 커밋하지 않도록, 배포할 때만 저장소 Secrets 로 js/config.js 를 만들어 넣는다.
# 필요한 Secrets: YOUTUBE_API_KEY, GOOGLE_CLIENT_ID
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 두어야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write js/config.js from repository secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        # 값을 붙여넣을 때 섞인 공백/줄바꿈은 지우고, 형식이 틀리면 배포를 멈춘다
        # (배포가 멈추면 이전에 배포된 사이트가 그대로 유지된다)
        run: |
          YOUTUBE_API_KEY="$(printf '%s' "$YOUTUBE_API_KEY" | tr -d '[:space:]')"
          GOOGLE_CLIENT_ID="$(printf '%s' "$GOOGLE_CLIENT_ID" | tr -d '[:space:]')"
          if ! printf '%s' "$YOUTUBE_API_KEY" | grep -Eq '^AIza[0-9A-Za-z_-]{35}$'; then
            echo "::error::YOUTUBE_API_KEY secret is missing or is not an API key (AIza...)"
            exit 1
          fi
          if [ -n "$GOOGLE_CLIENT_ID" ] && ! printf '%s' "$GOOGLE_CLIENT_ID" | grep -Eq '^[0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com$'; then
            echo "::error::GOOGLE_CLIENT_ID secret is not an OAuth client ID (...apps.googleusercontent.com)"
            exit 1
          fi
          printf "const YOUTUBE_API_KEY = '%s';\nconst GOOGLE_CLIENT_ID = '%s';\n" "$YOUTUBE_API_KEY" "$GOOGLE_CLIENT_ID" > js/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
