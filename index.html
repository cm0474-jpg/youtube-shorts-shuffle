<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <title>Shorts Shuffle</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="stage">
    <!-- 영상 플레이어 (스와이프할 때 이 프레임이 위아래로 움직인다) -->
    <div class="frame" id="frame">
      <div id="player"></div>
    </div>

    <!-- iframe 위를 덮어서 터치/마우스 입력을 대신 받는 투명 레이어 -->
    <div class="touch-layer" id="touchLayer"></div>

    <!-- 위/아래는 유튜브 숏츠 자체 UI(채널명, 제목, 좋아요)가 차지하므로 버튼은 오른쪽 가운데에 둔다 -->
    <!-- 좋아요/댓글 버튼은 API 키가 있을 때만 보인다 -->
    <nav class="side-actions">
      <div class="action" id="likeAction" hidden>
        <span class="round-btn" aria-hidden="true">👍</span>
        <span class="action-label" id="likeCount">좋아요</span>
      </div>
      <button class="action" id="commentBtn" type="button" aria-label="댓글 보기" hidden>
        <span class="round-btn" aria-hidden="true">💬</span>
        <span class="action-label" id="commentCount">댓글</span>
      </button>
      <button class="round-btn" id="soundBtn" type="button" aria-label="소리 켜기">🔇</button>
      <button class="round-btn" id="shuffleBtn" type="button" aria-label="다시 섞기">🔀</button>
      <button class="round-btn" id="sourceBtn" type="button" aria-label="다른 채널/재생목록 불러오기">📂</button>
    </nav>

    <!-- 오른쪽 위 ⋮ 메뉴 (설명, 자막, 화질) -->
    <button class="more-btn" id="moreBtn" type="button" aria-label="더보기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>

    <div class="center-icon" id="centerIcon" aria-hidden="true"></div>

    <!-- 아래에서 올라오는 창 -->
    <div class="sheet-backdrop" id="sheetBackdrop"></div>

    <section class="sheet" id="commentsSheet" aria-hidden="true" aria-labelledby="commentsTitle">
      <header class="sheet-header">
        <h2 id="commentsTitle">댓글</h2>
        <button class="sheet-close" type="button" data-close aria-label="닫기">✕</button>
      </header>
      <div class="sheet-body">
        <ul class="comment-list" id="commentsList"></ul>
        <p class="sheet-status" id="commentsStatus"></p>
        <button class="sheet-btn" id="commentsMore" type="button" hidden>댓글 더 보기</button>
      </div>
    </section>

    <section class="sheet sheet-compact" id="menuSheet" aria-hidden="true" aria-label="더보기 메뉴">
      <div class="sheet-handle" aria-hidden="true"></div>
      <ul class="menu-list">
        <li>
          <button class="menu-item" id="menuDesc" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
            <span>설명</span>
          </button>
        </li>
        <li>
          <button class="menu-item" id="menuCaptions" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 14H5V6h14zM7 15h3a1 1 0 0 0 1-1v-1H9.5v.5h-2v-3h2v.5H11v-1a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1zm7 0h3a1 1 0 0 0 1-1v-1h-1.5v.5h-2v-3h2v.5H18v-1a1 1 0 0 0-1-1h-3a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1z"/></svg>
            <span>자막</span>
            <span class="menu-value" id="menuCaptionsValue">사용 안함</span>
          </button>
        </li>
        <li>
          <button class="menu-item" id="menuQuality" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17v2h6v-2zM3 5v2h10V5zm10 16v-2h8v-2h-8v-2h-2v6zM7 9v2H3v2h4v2h2V9zm14 4v-2H11v2zm-6-4h2V7h4V5h-4V3h-2z"/></svg>
            <span>화질</span>
            <span class="menu-value" id="menuQualityValue">자동</span>
          </button>
        </li>
      </ul>
    </section>

    <section class="sheet" id="descSheet" aria-hidden="true" aria-labelledby="descHeading">
      <header class="sheet-header">
        <h2 id="descHeading">설명</h2>
        <button class="sheet-close" type="button" data-close aria-label="닫기">✕</button>
      </header>
      <div class="sheet-body">
        <p class="sheet-status" id="descStatus"></p>
        <div id="descContent" hidden>
          <h3 class="desc-title" id="descTitle"></h3>
          <div class="desc-channel">
            <img class="avatar" id="descAvatar" alt="" referrerpolicy="no-referrer">
            <span id="descChannel"></span>
          </div>
          <dl class="desc-stats">
            <div><dt id="descLikes"></dt><dd>좋아요</dd></div>
            <div><dt id="descViews"></dt><dd>조회수</dd></div>
            <div><dt id="descDate"></dt><dd id="descYear"></dd></div>
          </dl>
          <p class="desc-text" id="descText"></p>
        </div>
      </div>
    </section>

    <section class="sheet sheet-compact" id="captionSheet" aria-hidden="true" aria-labelledby="captionHeading">
      <header class="sheet-header">
        <h2 id="captionHeading">자막</h2>
        <button class="sheet-close" type="button" data-close aria-label="닫기">✕</button>
      </header>
      <div class="sheet-body">
        <ul class="option-list" id="captionList"></ul>
        <p class="sheet-status" id="captionStatus"></p>
      </div>
    </section>

    <section class="sheet sheet-compact" id="qualitySheet" aria-hidden="true" aria-labelledby="qualityHeading">
      <header class="sheet-header">
        <h2 id="qualityHeading">화질</h2>
        <button class="sheet-close" type="button" data-close aria-label="닫기">✕</button>
      </header>
      <div class="sheet-body">
        <ul class="option-list">
          <li><button class="option-item selected" type="button" disabled><span id="qualityCurrent">자동</span></button></li>
        </ul>
        <p class="sheet-note">유튜브 정책상 외부 앱에서는 화질을 직접 고를 수 없어서, 네트워크 상태에 맞춰 자동으로 정해져요.</p>
      </div>
    </section>

    <!-- 시작 화면: 처음 열면 링크를 넣는 화면이 나오고, 재생 중에는 📂 로 다시 연다 -->
    <section class="start-screen" id="startScreen" aria-labelledby="startTitle">
      <div class="start-inner">
        <button class="start-back" id="startBack" type="button" hidden>← 재생 화면으로 돌아가기</button>
        <h1 id="startTitle">Shorts Shuffle</h1>
        <p class="start-desc">유튜브 채널의 숏츠나 재생목록을 랜덤으로 재생해요</p>
        <form class="source-form" id="sourceForm">
          <input id="sourceInput" type="text" inputmode="url" autocomplete="off" spellcheck="false"
                 placeholder="재생목록 또는 채널 링크 붙여넣기" aria-label="재생목록 또는 채널 링크">
          <button id="sourceSubmit" type="submit">불러오기</button>
        </form>
        <p class="sheet-status" id="sourceStatus" role="status"></p>
        <ul class="source-help">
          <li>채널: youtube.com/@채널이름 (채널의 숏츠만 불러와요)</li>
          <li>재생목록: youtube.com/playlist?list=…</li>
        </ul>
        <p class="source-current" id="sourceCurrent"></p>
      </div>
    </section>

  </main>

  <script src="js/config.js"></script>
  <script src="js/youtube-api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/menu.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
